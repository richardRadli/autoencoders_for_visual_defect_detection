services:
  data_operations:
    build:
      context: .
      dockerfile: services/data_operations/Dockerfile
    container_name: data_operations
    command: uvicorn services.data_operations.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./dataset:/app/dataset
      - ./storage:/app/storage
      - ./services:/app/services
      - ./shared:/app/shared
      - ./utils:/app/utils
    environment:
      - DATASET_ROOT=/app/dataset
      - STORAGE_ROOT=/app/storage
      - TZ=Europe/Budapest
    networks:
      - defect-detection-network

  defect_detection:
    build:
      context: .
      dockerfile: services/defect_detection/Dockerfile
    container_name: defect_detection
    command: uvicorn services.defect_detection.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    volumes:
      - ./dataset:/app/dataset
      - ./storage:/app/storage
      - ./services:/app/services
      - ./shared:/app/shared
      - ./utils:/app/utils
    environment:
      - DATASET_ROOT=/app/dataset
      - STORAGE_ROOT=/app/storage
      - CELERY_BROKER_URL=redis://redis_broker:6379/0
      - CELERY_RESULT_BACKEND=redis://redis_broker:6379/0
      - TZ=Europe/Budapest
    shm_size: "16gb"
    depends_on:
      - redis_broker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - defect-detection-network

  redis_broker:
    image: redis:7-alpine
    container_name: defect_detection_redis
    restart: unless-stopped
    networks:
      - defect-detection-network

  defect_detection_worker:
    build:
      context: .
      dockerfile: services/defect_detection/Dockerfile
    container_name: defect_detection_worker
    command: celery -A services.defect_detection.tasks.celery_app worker --loglevel=info -c 1
    volumes:
      - ./dataset:/app/dataset
      - ./storage:/app/storage
      - ./services:/app/services
      - ./shared:/app/shared
      - ./utils:/app/utils
    environment:
      - DATASET_ROOT=/app/dataset
      - STORAGE_ROOT=/app/storage
      - CELERY_BROKER_URL=redis://redis_broker:6379/0
      - CELERY_RESULT_BACKEND=redis://redis_broker:6379/0
      - TZ=Europe/Budapest
    shm_size: "16gb"
    depends_on:
      - redis_broker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - defect-detection-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: defect_detection_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
      - DATA_OPS_PROXY_TARGET=http://data_operations:8000
      - DEFECT_PROXY_TARGET=http://defect_detection:8000
    restart: unless-stopped
    depends_on:
      - data_operations
      - defect_detection
    networks:
      - defect-detection-network

networks:
  defect-detection-network:
    driver: bridge